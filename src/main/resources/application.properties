spring.application.name=eco-air-backend
server.port=8080

# Persistencia en memoria (H2) gestionada por Hibernate
spring.datasource.url=jdbc:h2:mem:ecoairdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Arranque perezoso: en la estacion remota el contenedor debe quedar operativo
# en menos de 15 s, por lo que no se inicializan beans no criticos al bootear.
spring.main.lazy-initialization=true

# Pool de conexiones minimo: el consumo de hilos es el principal enemigo en
# una caja con 128-256 MB de RAM.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# Observabilidad minima
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
